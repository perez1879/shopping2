<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CATEGORIA</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#f2f2f2;
}

.regresar{
    display:block;
    text-align:center;
    padding:15px;
    background:black;
    color:white;
    text-decoration:none;
}

.contenedor{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    width:250px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:15px;
    text-align:center;
}

.precio{
    color:green;
    font-size:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<a href="index.html" class="regresar">⬅ Volver</a>

<h1 style="text-align:center;">CATEGORIA</h1>

<div class="contenedor">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1521335629791-ce4aec67dd53">
        <div class="card-content">
            <h3>Producto 1</h3>
            <p>Descripción del producto.</p>
            <p class="precio">$100</p>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">
        <div class="card-content">
            <h3>Producto 2</h3>
            <p>Descripción del producto.</p>
            <p class="precio">$150</p>
        </div>
    </div>

</div>

</body>
</html>
